steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: redpencil/ldes-delta-pusher
      tags: "fix-${CI_COMMIT_BRANCH##fix/}"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
when:
  - event: push
    branch: [fix/*]
